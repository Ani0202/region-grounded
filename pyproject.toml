[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "region_grounded"
version = "0.1.0"
description = "Region-grounded fine-tuning for late-interaction VLMs (TTIC 31280, Spring 2026)"
requires-python = ">=3.10"
authors = [
    {name = "Aniket Agrawal"},
    {name = "Siddharth Raj"},
]
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.45",
    "peft>=0.12",
    "accelerate>=0.33",
    "datasets>=2.20",
    "pillow>=10.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "einops>=0.8",
    "pyarrow>=15.0",
    "qwen-vl-utils>=0.0.8",
    "tensorboard>=2.16",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
]

[project.optional-dependencies]
eval = [
    "pycocotools>=2.0",
]
wandb = [
    "wandb>=0.17",
]
dev = [
    "ruff>=0.5",
    "ipykernel>=6.29",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
